name: 刷新福利站数据

on:
  schedule:
    # 每 6 小时刷新一次（避开整点，降低被限流概率）
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/sites.json'
      - 'scripts/**'
      - 'docs/assets/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 单测（合并逻辑不能把页面刷空）
        run: npm test

      - name: 抓取站点实时数据
        run: npm run refresh

      - name: 重新生成 README 与落地页
        run: npm run build

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "数据没有变化，跳过提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs data/live.json
          git commit -m "chore: 自动刷新福利站数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
